<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Build Your Project Management Approach</title>
<meta name="description" content="A free test that builds a project management profile: approach, philosophy, framework and supporting techniques.">
<style>
:root {
  /* Palette taken from the brand banner: cream, deep maroon, gold, dusty rose */
  --bg: #F8ECDE;
  --surface: #FFFAF4;
  --ink: #2E1D1B;
  --muted: #7C6455;
  --line: #E9D8C6;
  --line-strong: #D3B79E;
  --accent: #4A1116;
  --accent-hover: #360B0F;
  --accent-soft: #F3E2D8;
  --accent-line: #D9B6A8;
  --gold: #A6803F;
  --gold-soft: #E3D0AC;
  --rose: #D19A8A;
  --r-sheet: 24px;
  --r-card: 14px;
  --r-tile: 10px;
  --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --shadow: 0 1px 2px rgba(46, 29, 27, .05), 0 14px 34px -14px rgba(74, 17, 22, .18);
  --ease: cubic-bezier(.2, .7, .2, 1);
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; }
a { color: var(--accent); }
:focus-visible { outline: 3px solid rgba(74, 17, 22, .35); outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

#app { min-height: 100vh; display: flex; flex-direction: column; }

/* ---------- Language switch ---------- */
.langbar { position: absolute; top: 0; right: 0; left: 0; z-index: 20; pointer-events: none; }
.langswitch {
  pointer-events: auto;
  position: absolute; top: 18px; right: 20px;
  display: inline-flex; gap: 2px; padding: 3px;
  background: var(--surface); border: 1px solid var(--line);
  border-radius: 999px; box-shadow: 0 1px 2px rgba(38, 32, 44, .05);
}
.lang-btn {
  border: 0; background: none; cursor: pointer;
  padding: 5px 12px; border-radius: 999px;
  font-size: 13px; font-weight: 650; letter-spacing: .02em; color: var(--muted);
  transition: background-color .15s, color .15s;
}
.lang-btn:hover { color: var(--ink); }
.lang-btn.is-on { background: var(--accent); color: #FFF6E9; }
@media (max-width: 640px) {
  .langswitch { top: 10px; right: 12px; }
  .lang-btn { padding: 5px 10px; font-size: 12px; }
}
.wrap { width: 100%; max-width: 720px; margin: 0 auto; padding: 0 20px; }
.wrap--wide { max-width: 1040px; }

/* ---------- Buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 48px; padding: 0 24px;
  border-radius: 999px; border: 1px solid transparent;
  font-weight: 600; font-size: 15px; letter-spacing: -.005em;
  cursor: pointer; text-decoration: none;
  transition: background-color .15s, border-color .15s, color .15s, opacity .15s;
}
.btn-primary { background: var(--accent); color: #FFF6E9; }
.btn-primary:hover { background: var(--accent-hover); }
.btn-primary[disabled] { background: #E5D5C4; color: #8A7364; cursor: not-allowed; }
.btn-outline { background: var(--surface); border-color: var(--line-strong); }
.btn-outline:hover { border-color: var(--ink); }
.btn-ghost { background: transparent; color: var(--muted); padding: 0 14px; }
.btn-ghost:hover { color: var(--ink); }
.link-btn {
  background: none; border: 0; padding: 6px 0; cursor: pointer;
  color: var(--accent); font-weight: 600; font-size: 15px;
  display: inline-flex; align-items: center; gap: 8px;
}
.link-btn:hover { text-decoration: underline; text-underline-offset: 3px; }
.link-btn .chev { transition: transform .2s var(--ease); display: block; }
.link-btn[aria-expanded="true"] .chev { transform: rotate(180deg); }

/* ---------- Family chip ---------- */
.chip {
  display: inline-flex; align-items: center; height: 26px; padding: 0 11px;
  border-radius: 99px; border: 1px solid var(--accent-line); background: var(--accent-soft);
  color: var(--accent); font-size: 13px; font-weight: 600;
}

/* ---------- Word map ---------- */
.wordmap-section { margin-top: 52px; }
.wordmap {
  display: flex; flex-wrap: wrap; justify-content: center; align-items: center;
  gap: 8px 26px; margin: 0 auto; max-width: 900px;
}
.word {
  background: none; border: 0; padding: 6px 2px; margin: 0; cursor: pointer;
  color: var(--ink); line-height: 1.02; letter-spacing: -.025em; font-weight: 650;
  border-bottom: 2px solid transparent;
  transition: color .18s var(--ease), border-color .18s var(--ease), opacity .18s;
  animation: wordIn .6s var(--ease) backwards, drift 9s ease-in-out infinite alternate;
}
.word.s1 { font-size: clamp(15px, 1.4vw, 17px); font-weight: 500; color: var(--muted); }
.word.s2 { font-size: clamp(18px, 2vw, 23px); font-weight: 600; }
.word.s3 { font-size: clamp(22px, 2.8vw, 31px); }
.word.s4 { font-size: clamp(28px, 4vw, 44px); font-weight: 700; letter-spacing: -.035em; }
.word.is-serif { font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--gold); }
.word:hover { color: var(--accent); }
.word.is-active { color: var(--accent); border-bottom-color: var(--accent); }
.wordmap.has-active .word:not(.is-active) { opacity: .45; }
@keyframes wordIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@keyframes drift { from { transform: translateY(-3px); } to { transform: translateY(3px); } }

.wordcard {
  max-width: 640px; margin: 30px auto 0;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card);
  padding: 22px 24px; box-shadow: var(--shadow);
}
.wordcard.is-empty {
  background: none; border-style: dashed; border-color: var(--line-strong); box-shadow: none;
  display: flex; align-items: center; justify-content: center; text-align: center;
  color: var(--muted); font-size: 15px; padding: 16px;
}
.wordcard-body { animation: fadeIn .28s var(--ease) both; }
.wordcard-top { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; }
.wordcard h3 { margin: 0; font-size: 22px; letter-spacing: -.02em; font-weight: 700; line-height: 1.15; }
.wordcard-tagline { margin: 10px 0 14px; font-size: 17px; font-weight: 600; line-height: 1.4; color: var(--accent); }
.wordcard dl { margin: 0; display: grid; gap: 12px; }
.wordcard dt { font-weight: 650; font-size: 14px; }
.wordcard dd { margin: 2px 0 0; color: var(--muted); font-size: 15px; }
.wordcard .flow { margin-top: 14px; }
.wordcard-close { margin-top: 16px; }

/* ---------- Intro ---------- */
.intro { flex: 1; padding: 76px 0 72px; }
.intro-hero { display: flex; flex-direction: column; align-items: center; text-align: center; }
.slab {
  display: block; color: var(--accent); margin: 0;
  font-size: clamp(34px, 5.4vw, 60px); line-height: 1.08;
  font-weight: 800; letter-spacing: -.025em;
  max-width: 17ch;
}
.rule { display: flex; align-items: center; gap: 14px; margin: 26px 0 20px; width: min(440px, 82%); color: var(--gold); }
.rule::before, .rule::after { content: ""; flex: 1; height: 1px; background: currentColor; opacity: .6; }
.intro-lead { font-size: clamp(19px, 2.4vw, 27px); font-weight: 700; letter-spacing: -.015em; line-height: 1.25; color: var(--ink); margin: 0 0 18px; max-width: 26ch; }
.intro-text { color: var(--muted); font-size: 17px; margin: 0 0 30px; max-width: 58ch; }
.intro-cta { display: flex; flex-direction: column; align-items: center; gap: 12px; }
.intro-cta .btn { min-height: 54px; padding: 0 30px; font-size: 16px; }
.intro-time { font-size: 13px; color: var(--muted); margin: 0; }
.map-caption { margin: 0 0 22px; font-size: 14px; color: var(--muted); text-align: center; }

/* ---------- Quiz ---------- */
.quiz { flex: 1; display: flex; flex-direction: column; padding: 62px 0 0; }
.progress-row { display: flex; justify-content: space-between; align-items: baseline; font-size: 14px; color: var(--muted); margin-bottom: 10px; font-variant-numeric: tabular-nums; }
.progress-row strong { color: var(--ink); font-weight: 600; }
.bar { height: 6px; background: #EBDCCA; border-radius: 99px; overflow: hidden; }
.bar-fill { height: 100%; background: var(--accent); border-radius: 99px; transition: width .45s var(--ease); }
.stage { padding: 40px 0 24px; }
.stage.in-fwd { animation: inFwd .35s var(--ease) both; }
.stage.in-back { animation: inBack .35s var(--ease) both; }
@keyframes inFwd { from { opacity: 0; transform: translateX(18px); } to { opacity: 1; transform: none; } }
@keyframes inBack { from { opacity: 0; transform: translateX(-18px); } to { opacity: 1; transform: none; } }
.q-title { font-size: clamp(24px, 3.6vw, 32px); line-height: 1.15; letter-spacing: -.02em; font-weight: 750; margin: 0 0 8px; }
.q-title:focus { outline: none; }
.q-help { color: var(--muted); margin: 0 0 28px; font-size: 16px; }
.q-help:empty { display: none; }
.q-title + .options { margin-top: 28px; }

.options { display: grid; gap: 10px; }
.options.is-compact { grid-template-columns: 1fr 1fr; }
.opt {
  display: flex; align-items: center; gap: 14px; width: 100%;
  text-align: left; cursor: pointer;
  background: var(--surface); border: 1.5px solid var(--line);
  border-radius: var(--r-card); padding: 16px 16px 16px 18px; min-height: 62px;
  transition: border-color .15s, background-color .15s, box-shadow .15s;
}
.opt:hover { border-color: var(--line-strong); }
.opt[aria-checked="true"] { border-color: var(--accent); background: var(--accent-soft); box-shadow: 0 0 0 1px var(--accent) inset; }
.opt-dot {
  flex: none; width: 20px; height: 20px; border-radius: 50%;
  border: 1.5px solid var(--line-strong); background: #fff; position: relative;
  transition: border-color .15s;
}
.opt[aria-checked="true"] .opt-dot { border-color: var(--accent); }
.opt[aria-checked="true"] .opt-dot::after {
  content: ""; position: absolute; inset: 4px; border-radius: 50%; background: var(--accent);
  animation: pop .2s var(--ease);
}
@keyframes pop { from { transform: scale(.3); } to { transform: scale(1); } }
.opt-text { flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.opt-label { font-weight: 600; font-size: 16px; line-height: 1.3; }
.opt-sub { font-size: 14px; color: var(--muted); line-height: 1.35; }
.opt-key {
  flex: none; font-size: 12px; color: var(--muted); border: 1px solid var(--line);
  border-radius: 6px; min-width: 22px; height: 22px; display: inline-flex; align-items: center; justify-content: center;
  font-variant-numeric: tabular-nums;
}
.options.is-compact .opt { min-height: 56px; padding: 12px 14px; }
.options.is-compact .opt-label { font-size: 15px; }

.q-nav {
  position: sticky; bottom: 0; z-index: 5;
  background: linear-gradient(to top, var(--bg) 70%, rgba(245, 244, 247, 0));
  padding: 16px 0 24px;
}
.q-nav-inner { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.kbd-hint { font-size: 13px; color: var(--muted); }
.continue-note { font-size: 13px; color: var(--muted); text-align: right; min-height: 20px; margin: 6px 0 0; }

/* ---------- Result ---------- */
.result-page { padding: 62px 0 56px; }
.sheet { background: var(--surface); border-radius: var(--r-sheet); box-shadow: var(--shadow); padding: 40px; }
.result-head { border-left: 4px solid var(--accent); padding-left: 24px; animation: reveal .5s var(--ease) both; }
.result-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; }
@keyframes reveal { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: none; } }
.result-kicker { margin: 0 0 8px; font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--gold); }
.result-name { margin: 0; font-size: clamp(27px, 4.2vw, 40px); line-height: 1.06; letter-spacing: -.02em; font-weight: 800; text-transform: uppercase; }
.result-tagline { margin: 12px 0 14px; font-size: 19px; font-weight: 600; line-height: 1.35; color: var(--accent); }
.strength { display: inline-flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 600; }
.dots { display: inline-flex; gap: 4px; }
.dots i { width: 22px; height: 6px; border-radius: 99px; background: #EBDCCA; }
.dots i.on { background: var(--accent); animation: dotIn .4s var(--ease) both; }
.dots i.on:nth-child(2) { animation-delay: .12s; }
.dots i.on:nth-child(3) { animation-delay: .24s; }
@keyframes dotIn { from { transform: scaleX(0); transform-origin: left; } to { transform: scaleX(1); } }
.close-call { margin: 24px 0 0; padding: 12px 16px; border-radius: 12px; background: var(--accent-soft); color: var(--ink); font-size: 15px; }

/* ---------- Profile header ---------- */
.tagline-row { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0 0; }
.tag {
  display: inline-flex; align-items: center; height: 26px; padding: 0 12px;
  border-radius: 99px; background: var(--accent); color: #FFF6E9;
  font-size: 12px; font-weight: 700; letter-spacing: .06em;
}
.result-what { margin: 16px 0 0; color: var(--muted); max-width: 56ch; }
.read-note { margin: 10px 0 0; font-size: 13px; color: var(--muted); }
.section-note { margin: 0 0 16px; font-size: 14px; color: var(--muted); }
.r-section .section-note + .stack { margin-top: 4px; }

/* ---------- The stack ---------- */
.stack { display: grid; gap: 0; }
.layer {
  border: 1.5px solid var(--line); border-radius: var(--r-card);
  padding: 16px 18px; background: var(--surface);
  animation: layerIn .4s var(--ease) both;
}
.layer:nth-child(3) { animation-delay: .08s; }
.layer:nth-child(5) { animation-delay: .16s; }
.layer:nth-child(7) { animation-delay: .24s; }
.layer:nth-child(9) { animation-delay: .32s; }
@keyframes layerIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.layer.is-supporting { background: #FCF3E8; border-style: dashed; }
.layer.is-muted { background: none; border-style: dashed; }
.layer.is-muted .layer-name { color: var(--muted); font-weight: 600; }
.layer-label { margin: 0 0 5px; font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--gold); }
.layer.is-supporting .layer-label, .layer.is-muted .layer-label { color: var(--muted); }
.layer-name { margin: 0; font-size: 20px; line-height: 1.2; letter-spacing: -.02em; font-weight: 700; }
.layer-note { margin: 6px 0 0; color: var(--muted); font-size: 15px; }
.layer-caveat { margin: 10px 0 0; font-size: 14px; color: var(--ink); background: var(--accent-soft); border-radius: 10px; padding: 10px 12px; }
.layer .link-btn { font-size: 14px; margin-top: 8px; }
.layer .learn { margin-top: 10px; }
.connector { text-align: center; color: var(--gold); font-size: 18px; line-height: 1; padding: 8px 0; font-weight: 700; }

/* ---------- Profile bars ---------- */
.metrics { display: grid; gap: 10px; }
.metric { display: grid; grid-template-columns: 132px 1fr 30px; align-items: center; gap: 12px; }
.metric-label { font-size: 14px; font-weight: 600; }
.metric-track { height: 8px; background: #EBDCCA; border-radius: 99px; overflow: hidden; }
.metric-fill { display: block; height: 100%; border-radius: 99px; background: var(--accent); animation: growBar .6s var(--ease) both; transform-origin: left; }
@keyframes growBar { from { transform: scaleX(0); } to { transform: scaleX(1); } }
.metric-value { font-size: 13px; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }

/* ---------- Combination diagram ---------- */
.combo {
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px;
  padding: 20px; border-radius: var(--r-card); background: var(--accent-soft);
  margin: 0 0 16px;
}
.combo-item { font-weight: 700; letter-spacing: -.01em; font-size: 15px; color: var(--accent); }
.combo-item.is-main { font-size: 22px; }
.combo-item.is-side { font-size: 15px; }
.combo-op { color: var(--accent); opacity: .6; font-weight: 700; }

.step-extra { margin: 22px 0 0; font-size: 15px; color: var(--muted); }
.step-extra strong { color: var(--ink); }
.warnings { margin: 0; padding-left: 20px; display: grid; gap: 8px; color: var(--muted); }
.warnings li { padding-left: 2px; }
.warnings li::marker { color: var(--gold); }

.r-section { border-top: 1px solid var(--line); margin-top: 32px; padding-top: 28px; }
.r-section h2 { font-size: 18px; letter-spacing: -.005em; margin: 0 0 12px; font-weight: 750; }
.r-section p { margin: 0; max-width: 62ch; }
.checks { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.checks li { display: flex; gap: 12px; align-items: flex-start; }
.checks svg { flex: none; margin-top: 3px; }
.steps { list-style: none; margin: 0; padding: 0; counter-reset: step; display: grid; gap: 16px; }
.steps li { counter-increment: step; display: grid; grid-template-columns: 32px 1fr; gap: 14px; }
.steps li::before {
  content: counter(step); width: 32px; height: 32px; border-radius: 50%;
  border: 1.5px solid var(--gold-soft); color: var(--gold);
  display: inline-flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px;
}
.steps strong { display: block; font-weight: 650; }
.steps span { color: var(--muted); font-size: 15px; }

.learn-toggle { margin-top: 28px; }
.learn { margin-top: 14px; border: 1px solid var(--line); border-radius: var(--r-card); padding: 22px; background: #FCF3E8; }
.learn:not([hidden]) { animation: openUp .28s var(--ease); }
@keyframes openUp { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
.learn dl { margin: 0; display: grid; gap: 14px; }
.learn dt { font-weight: 650; font-size: 14px; }
.learn dd { margin: 2px 0 0; color: var(--muted); font-size: 15px; }
.learn-ex { margin-top: 18px; }
.learn-ex-title { font-weight: 650; font-size: 14px; margin: 0 0 10px; }
.flow { list-style: none; padding: 0; margin: 0; display: flex; flex-wrap: wrap; gap: 8px 6px; align-items: center; }
.flow li { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; }
.flow li span { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 5px 10px; }
.flow li:not(:last-child)::after { content: "→"; color: var(--muted); }
.learn-note { margin: 10px 0 0; font-size: 14px; color: var(--muted); }
.ref-line { margin: 16px 0 0; padding-top: 12px; border-top: 1px solid var(--line); font-size: 13px; color: var(--muted); line-height: 1.5; }
.ref-note { display: block; margin-bottom: 6px; }
.ref-note strong { color: var(--ink); font-weight: 650; }
.ref-line a { color: var(--accent); font-weight: 600; text-underline-offset: 2px; }

.also { margin-top: 20px; border: 1.5px solid var(--line); border-radius: var(--r-sheet); padding: 28px 32px; }
.also-label { margin: 0 0 14px; font-size: 14px; font-weight: 600; color: var(--muted); }
.also-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
.also-name { margin: 0; font-size: 22px; letter-spacing: -.02em; font-weight: 700; line-height: 1.15; }
.also-head .strength { margin-top: 6px; }
.also-if { margin: 16px 0 6px; font-size: 17px; font-weight: 600; line-height: 1.4; color: var(--accent); }
.also-why { margin: 0; color: var(--muted); font-size: 15px; }
.also .learn-toggle { margin-top: 12px; }

.others { margin-top: 24px; }
.others-body { margin-top: 8px; color: var(--muted); font-size: 15px; max-width: 64ch; }
.others-body p { margin: 0 0 10px; }

.lesson { margin-top: 40px; padding: 4px 0 4px 20px; border-left: 3px solid var(--gold); }
.lesson p { margin: 0 0 8px; max-width: 60ch; }
.lesson .big { font-size: 21px; line-height: 1.3; font-weight: 700; letter-spacing: -.015em; }
.lesson .small { color: var(--muted); font-size: 15px; }

.actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 36px; align-items: center; }
.copy-status { font-size: 14px; color: var(--accent); font-weight: 600; min-height: 20px; }
.copy-fallback { width: 100%; margin-top: 12px; }
.copy-fallback textarea { width: 100%; min-height: 110px; border: 1px solid var(--line-strong); border-radius: 12px; padding: 12px; font: inherit; font-size: 14px; resize: vertical; }

.source { margin: 40px 0 0; font-size: 13px; color: var(--muted); }
.source a { color: var(--muted); text-underline-offset: 2px; }
.source a:hover { color: var(--ink); }

.fade-in { animation: fadeIn .4s var(--ease) both; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

/* ---------- Responsive ---------- */
@media (max-width: 860px) {
  .intro { padding: 64px 0 56px; }
  .slab { max-width: 15ch; }
  .rule { margin: 20px 0 16px; }
}
@media (max-width: 640px) {
  .wrap { padding: 0 16px; }
  .options.is-compact { grid-template-columns: 1fr; }
  .opt-key, .kbd-hint { display: none; }
  .stage { padding: 28px 0 16px; }
  .sheet { padding: 26px 20px; border-radius: 20px; }
  .result-head { padding-left: 16px; }

  const merged = Object.assign({}, m, e);
  merged.category = ES_CATEGORY[m.category] || m.category;
  merged.learn = Object.assign({}, m.learn, e.learn || {});
  return merged;
}

function aT(key) {
  const a = APPROACHES[key];
  return LANG === "es" ? Object.assign({}, a, ES_APPROACHES[key] || {}) : a;
}

function barT(bar) {
  return LANG === "es" ? Object.assign({}, bar, ES_BARS[bar.id] || {}) : bar;
}


/* ==========================================================
   SCORING ENGINE (pure functions – no DOM)

   answers → dimensions → { approach, philosophy, framework,
   techniques, models, standard, bars, reasons, warnings }
   ========================================================== */

const PHILOSOPHIES = ["agile", "lean", "sixsigma"];
const FRAMEWORKS = ["scrum", "scrumban", "xp", "apf", "prince2", "per", "rad"];
const TECHNIQUES = ["kanban", "cpm", "ccpm", "outcome"];
const MODELS = ["waterfall", "npi"];
const AFFINITY_KEYS = PHILOSOPHIES.concat(FRAMEWORKS, TECHNIQUES, MODELS, ["pmbok"]);

const NEUTRAL = 50;

/* Dimensions that pull toward an adaptive or a predictive approach.
   "!dim" means the inverse of that dimension. */
const ADAPTIVE_DIMS = ["change", "uncertainty", "!clarity", "delivery", "stakeholder", "autonomy", "experimentation", "flow"];
const PREDICTIVE_DIMS = ["clarity", "!change", "!uncertainty", "regulation", "dependencies", "teamSize", "timePressure", "!flow"];

/* How each approach shifts the affinity of the other layers. */
const APPROACH_SHIFT = {
  predictive: { prince2: 2, per: 1, cpm: 1, scrum: -2, scrumban: -2, xp: -2, rad: -2, apf: -3, agile: -4, kanban: -1 },
  hybrid: { scrumban: 2, prince2: 1, per: 1, agile: 1 },
  adaptive: { scrum: 2, scrumban: 2, apf: 2, xp: 1, rad: 1, agile: 2, prince2: -3, per: -1, cpm: -1 }
};

/* Highest score each option could reach from the questions alone.
   Scores are compared as a ratio against this, so an approach that
   appears in many questions doesn't win just by accumulating points. */
const MAX_POSSIBLE = (() => {
  const max = {};
  AFFINITY_KEYS.forEach(k => {
    max[k] = Math.max(3, QUESTIONS.reduce((sum, q) =>
      sum + Math.max(0, ...q.options.map(o => (o.s && o.s[k]) || 0)), 0));
  });
  return max;
})();

function getOption(qid, oid) {
  const q = QUESTIONS.find(x => x.id === qid);
  return q ? q.options.find(o => o.id === oid) : undefined;
}

function dimValue(dims, token) {
  const inverse = token.charAt(0) === "!";
  const key = inverse ? token.slice(1) : token;
  const v = dims[key] === undefined ? NEUTRAL : dims[key];
  return inverse ? 100 - v : v;
}

const avg = list => list.reduce((a, b) => a + b, 0) / (list.length || 1);

/* ---------- dimensions ---------- */
function computeDims(answers) {
  const buckets = {};
  QUESTIONS.forEach(q => {
    const opt = getOption(q.id, answers[q.id]);
    if (!opt || !opt.dims) return;
    Object.entries(opt.dims).forEach(([k, v]) => {
      (buckets[k] = buckets[k] || []).push(v);
    });
  });
  const dims = {};
  Object.entries(buckets).forEach(([k, values]) => { dims[k] = Math.round(avg(values)); });
  return dims;
}

function computeBars(dims) {
  return BARS.map(b => ({
    id: b.id, label: b.label, tag: b.tag,
    value: Math.round(avg(b.dims.map(d => dimValue(dims, d))))
  }));
}

/* ---------- affinities ---------- */
function computeAffinity(answers) {
  const score = {};
  const contrib = {};
  AFFINITY_KEYS.forEach(k => { score[k] = 0; contrib[k] = {}; });
  QUESTIONS.forEach(q => {
    const opt = getOption(q.id, answers[q.id]);
    if (!opt || !opt.s) return;
    Object.entries(opt.s).forEach(([k, v]) => {
      if (score[k] === undefined) return;
      score[k] += v;
      contrib[k][q.id] = (contrib[k][q.id] || 0) + v;
    });
  });
  return { score, contrib };
}

/* ---------- approach ---------- */
function decideApproach(dims) {
  const adaptive = avg(ADAPTIVE_DIMS.map(d => dimValue(dims, d)));
  const predictive = avg(PREDICTIVE_DIMS.map(d => dimValue(dims, d)));
  const delta = adaptive - predictive;

  let key = delta > 8 ? "adaptive" : delta < -8 ? "predictive" : "hybrid";

  // Strong pull from the other side turns a clear winner into a hybrid.
  const rigid = dimValue(dims, "regulation") >= 68 || dimValue(dims, "dependencies") >= 72 || dimValue(dims, "teamSize") >= 78;
  const fluid = dimValue(dims, "change") >= 68 || dimValue(dims, "uncertainty") >= 68;
  if (key === "adaptive" && rigid && delta < 16) key = "hybrid";
  if (key === "predictive" && fluid && delta > -16) key = "hybrid";

  return { key, adaptive: Math.round(adaptive), predictive: Math.round(predictive), delta: Math.round(delta), close: Math.abs(delta) <= 8 };
}

/* ---------- the full profile ---------- */
function computeResult(answers) {
  const dims = computeDims(answers);
  const bars = computeBars(dims);
  const { score, contrib } = computeAffinity(answers);
  const approach = decideApproach(dims);

  // approach-driven adjustment
  const adjusted = Object.assign({}, score);
  Object.entries(APPROACH_SHIFT[approach.key]).forEach(([k, v]) => {
    if (adjusted[k] !== undefined) adjusted[k] += v;
  });
  // gates: a framework that assumes a context you don't have
  if (dimValue(dims, "techComplexity") < 55) adjusted.xp -= 2;
  if (["techimpl", "process", "internal", "consulting"].indexOf(answers.type) < 0) adjusted.per -= 5;
  if (dimValue(dims, "resources") > 40) adjusted.ccpm -= 4;
  if (dimValue(dims, "behavior") < 62) adjusted.outcome -= 3;
  if (dimValue(dims, "dependencies") < 50 && dimValue(dims, "timePressure") < 60) adjusted.cpm -= 3;
  if (dimValue(dims, "regulation") >= 75) adjusted.rad -= 3;

  const fit = k => adjusted[k] / MAX_POSSIBLE[k];
  const rank = keys => keys.slice().sort((a, b) => fit(b) - fit(a));

  const fwRanked = rank(FRAMEWORKS);
  const framework = fwRanked[0];
  const frameworkAlt = fwRanked[1];
  const frameworkWeak = fit(framework) < 0.2;

  const phRanked = rank(PHILOSOPHIES);
  const philosophy = (fit(phRanked[0]) >= 0.22 && adjusted[phRanked[0]] >= 3) ? phRanked[0] : null;

  const tqRanked = rank(TECHNIQUES);
  let techniques = tqRanked.filter(k => fit(k) >= 0.3 && adjusted[k] >= 4).slice(0, 2);
  if (!techniques.length && adjusted[tqRanked[0]] >= 2) techniques = [tqRanked[0]];

  const models = [];
  const waterfallFits = approach.key === "predictive" &&
    dimValue(dims, "clarity") >= 65 && dimValue(dims, "change") <= 42 &&
    dimValue(dims, "uncertainty") <= 45 && dimValue(dims, "delivery") <= 45 &&
    dimValue(dims, "behavior") <= 65;
  if (waterfallFits) models.push("waterfall");
  if (answers.type === "launch" || fit("npi") >= 0.62) models.push("npi");

  const standard = (fit("pmbok") >= 0.34 || dimValue(dims, "regulation") >= 72 ||
    (dimValue(dims, "teamSize") >= 72 && dimValue(dims, "risk") >= 62)) ? "pmbok" : null;

  const picks = [framework].concat(philosophy ? [philosophy] : [], techniques, models, standard ? [standard] : []);

  const result = {
    dims, bars, approach, framework, frameworkAlt, frameworkWeak, philosophy, techniques, models, standard,
    picks, score, adjusted, contrib, answers, fit
  };
  result.reasons = topReasons(result, 4);
  result.tags = headlineTags(bars);
  return result;
}

/* ---------- explanations ---------- */

/* How strongly one answer pushed toward the approach the user got. */
function approachAlignment(opt, approachKey) {
  if (!opt.dims) return 0;
  let pull = 0;
  Object.entries(opt.dims).forEach(([k, v]) => {
    if (ADAPTIVE_DIMS.indexOf(k) >= 0 || ADAPTIVE_DIMS.indexOf("!" + k) >= 0) {
      pull += (ADAPTIVE_DIMS.indexOf(k) >= 0 ? 1 : -1) * (v - NEUTRAL) / 25;
    }
    if (PREDICTIVE_DIMS.indexOf(k) >= 0 || PREDICTIVE_DIMS.indexOf("!" + k) >= 0) {
      pull -= (PREDICTIVE_DIMS.indexOf(k) >= 0 ? 1 : -1) * (v - NEUTRAL) / 25;
    }
  });
  if (approachKey === "adaptive") return Math.max(0, pull);
  if (approachKey === "predictive") return Math.max(0, -pull);
  return Math.abs(pull) * 0.4;
}

function topReasons(result, count) {
  return QUESTIONS
    .map((q, i) => {
      const opt = getOption(q.id, result.answers[q.id]);
      if (!opt) return null;
      const points = result.picks.reduce((sum, key) => sum + Math.max(0, (result.contrib[key] || {})[q.id] || 0), 0);
      return { qid: q.id, i, because: opt.because, weight: points + approachAlignment(opt, result.approach.key) };
    })
    .filter(x => x && x.weight > 0.8)
    .sort((a, b) => (b.weight - a.weight) || (a.i - b.i))
    .slice(0, count);
}

/* Returns bar ids; the interface turns them into labels. */
function headlineTags(bars) {
  return bars.slice().sort((a, b) => b.value - a.value)
    .filter((b, i) => b.value >= 55 || i === 0)
    .slice(0, 3)
    .map(b => b.id);
}

/* Why the runner-up framework lost: the answer that favored it most. */
function altReasonOption(result) {
  const c = result.contrib[result.frameworkAlt] || {};
  const cw = result.contrib[result.framework] || {};
  const best = QUESTIONS
    .map(q => ({ q, edge: (c[q.id] || 0) - (cw[q.id] || 0), v: c[q.id] || 0 }))
    .filter(x => x.v > 0)
    .sort((a, b) => (b.edge - a.edge) || (b.v - a.v))[0];
  if (!best) return null;
  const opt = getOption(best.q.id, result.answers[best.q.id]);
  return opt ? { qid: best.q.id, opt: opt } : null;
}

function altReason(result) {
  const c = result.contrib[result.frameworkAlt] || {};
  const cw = result.contrib[result.framework] || {};
  const best = QUESTIONS
    .map(q => ({ q, edge: (c[q.id] || 0) - (cw[q.id] || 0), v: c[q.id] || 0 }))
    .filter(x => x.v > 0)
    .sort((a, b) => (b.edge - a.edge) || (b.v - a.v))[0];
  if (!best) return null;
  const opt = getOption(best.q.id, result.answers[best.q.id]);
  return opt ? opt.because : null;
}

/* 3 warning signs: framework first, then the approach. */
function warningsFor(result) {
  const list = (METHODS[result.framework].whenNot || []).slice(0, 2);
  list.push(APPROACHES[result.approach.key].whenNot);
  if (result.philosophy && METHODS[result.philosophy].whenNot && list.length < 3) {
    list.push(METHODS[result.philosophy].whenNot[0]);
  }
  return list.filter(Boolean).slice(0, 3);
}

/* Confidence label for the whole profile, from how decided the reading is. */
function profileStrength(result) {
  const gap = (result.fit(result.framework) - result.fit(result.frameworkAlt)) * 20;
  const decided = Math.abs(result.approach.delta);
  const level = (gap >= 4 && decided >= 12) ? 3 : (gap >= 2 || decided >= 8) ? 2 : 1;
  return { level, label: ["", "Worth exploring", "Good read", "Clear read"][level] };
}

    }];

    if (r.philosophy) {
      rows.push({ id: "philosophy", label: t("lPhilosophy"), key: r.philosophy,
        name: mT(r.philosophy).name, note: mT(r.philosophy).tagline, connector: "↓" });
    } else {
      rows.push({ id: "philosophy", label: t("lPhilosophy"), name: t("noPhilosophy"),
        note: t("noPhilosophyNote"), muted: true, connector: "↓" });
    }

    rows.push({ id: "framework", label: t("lFramework"), key: r.framework,
      name: mT(r.framework).name, note: mT(r.framework).tagline,
      caveat: r.frameworkWeak ? t("weakFramework") : null,
      connector: r.techniques.length ? "+" : null });

    r.techniques.forEach((k, i) => {
      rows.push({ id: "technique-" + k, label: i === 0 ? t("lTechnique") : t("lAlsoUseful"), key: k,
        name: mT(k).name, note: mT(k).tagline,
        connector: i < r.techniques.length - 1 ? "+" : null });
    });

    if (!r.techniques.length) {
      rows.push({ id: "technique-none", label: t("lTechnique"), name: t("noTechnique"),
        note: t("noTechniqueNote"), muted: true });
    }

    r.models.forEach(k => {
      rows.push({ id: "model-" + k, label: mT(k).category, key: k,
        name: mT(k).name, note: mT(k).tagline, supporting: true });
    });

    if (r.standard) {
      rows.push({ id: "standard", label: t("lReference"), key: r.standard,
        name: mT(r.standard).name, note: mT(r.standard).tagline, supporting: true });
    }
    return rows;
  }

  function stackHTML(rows) {
    return rows.map(row => {
      const learnId = row.key ? "learn-" + row.id : null;
      return `<div class="layer ${row.supporting ? "is-supporting" : ""} ${row.muted ? "is-muted" : ""}">
          <p class="layer-label">${esc(row.label)}</p>
          <h3 class="layer-name">${esc(row.name)}</h3>
          <p class="layer-note">${esc(row.note)}</p>
          ${row.caveat ? `<p class="layer-caveat">${esc(row.caveat)}</p>` : ""}
          ${learnId ? toggleBtn(learnId, t("learnAbout", short(row.key))) : ""}
          ${learnId ? learnHTML(row.key, learnId) : ""}
        </div>
        ${row.connector ? `<div class="connector" aria-hidden="true">${row.connector}</div>` : ""}`;
    }).join("");
  }

  function tagLabel(id) {
    const bar = BARS.filter(b => b.id === id)[0];
    return bar ? barT(bar).tag : id;
  }

  function barsHTML(bars) {
    return bars.map(barT).map((b, i) => `<div class="metric">
        <span class="metric-label">${esc(b.label)}</span>
        <span class="metric-track"><span class="metric-fill" style="width:${b.value}%;animation-delay:${i * 70}ms"></span></span>
        <span class="metric-value">${b.value}</span>
      </div>`).join("");
  }

  function comboLine(r) {
    const parts = [];
    if (r.philosophy) parts.push(mT(r.philosophy).name.toUpperCase());
    parts.push(short(r.framework).toUpperCase());
    const techs = r.techniques.map(k => short(k).toUpperCase());
    return { top: parts, techs };
  }

  function renderResult() {
    const r = computeResult(state.answers);
    const approach = aT(r.approach.key);
    const rows = layersOf(r);
    const strength = profileStrength(r);
    const combo = comboLine(r);

    const checks = r.reasons.map(x => {
      const opt = getOption(x.qid, state.answers[x.qid]);
      return `<li>${CHECK_SVG}<span>${esc(oT(x.qid, opt).because)}</span></li>`;
    }).join("");

    const roleParts = [mT(r.framework).role].concat(r.techniques.map(k => mT(k).role));
    const comboText = roleParts.join(" ");

    const steps = mT(r.framework).start
      .map(([ti, d]) => `<li><div><strong>${esc(ti)}</strong><span>${esc(d)}</span></div></li>`).join("");
    const techStep = r.techniques.length ? mT(r.techniques[0]).start[0] : null;

    const warnList = (mT(r.framework).whenNot || []).slice(0, 2).concat([aT(r.approach.key).whenNot]);
    const warnings = warnList.filter(Boolean).slice(0, 3).map(w => `<li>${esc(w)}</li>`).join("");
    const alt = mT(r.frameworkAlt);
    const altWhyOpt = altReasonOption(r);
    const altWhy = altWhyOpt ? oT(altWhyOpt.qid, altWhyOpt.opt).because : null;

    const shareTechs = r.techniques.map(short).join(" + ");
    lastShareText = t("shareTitle") + " " + approach.emoji + "\n" +
      t("shareApproach") + ": " + approach.name +
      (r.philosophy ? "  ·  " + t("sharePhilosophy") + ": " + mT(r.philosophy).name : "") +
      "  ·  " + t("shareFramework") + ": " + short(r.framework) +
      (shareTechs ? "  +  " + shareTechs : "") + "\n" +
      approach.tagline + "\n\n" + t("shareEnd");

    app.innerHTML = `
      <section class="result-page fade-in">
        <div class="wrap">
          <article class="sheet" aria-labelledby="result-name">
            <header class="result-head">
              <p class="result-kicker">${esc(t("kicker"))}</p>
              <h1 class="result-name" id="result-name" tabindex="-1">${esc((approach.name + " " + t("approachSuffix")).trim())}</h1>
              <p class="result-tagline">“${esc(approach.tagline)}”</p>
              <p class="tagline-row">${r.tags.map(id => `<span class="tag">${esc(tagLabel(id))}</span>`).join("")}</p>
              <p class="result-what">${esc(approach.what)}</p>
              <p class="read-note">${esc(t("readNote", t("read" + strength.level), TOTAL))}</p>
            </header>

            <section class="r-section">
              <h2>${esc(t("stackTitle"))}</h2>
              <p class="section-note">${esc(t("stackNote"))}</p>
              <div class="stack">${stackHTML(rows)}</div>
            </section>

            <section class="r-section">
              <h2>${esc(t("whyTitle"))}</h2>
              <ul class="checks">${checks}</ul>
            </section>

            <section class="r-section">
              <h2>${esc(t("profileTitle"))}</h2>
              <div class="metrics">${barsHTML(r.bars)}</div>
              <p class="section-note">${esc(t("profileNote"))}</p>
            </section>

            <section class="r-section">
              <h2>${esc(t("comboTitle"))}</h2>
              <div class="combo" aria-hidden="true">
                ${combo.top.map((t, i) => `<span class="combo-item ${i === combo.top.length - 1 ? "is-main" : ""}">${esc(t)}</span>${i < combo.top.length - 1 ? '<span class="combo-op">↓</span>' : ""}`).join("")}
                ${combo.techs.map(t => `<span class="combo-op">+</span><span class="combo-item is-side">${esc(t)}</span>`).join("")}
              </div>
              <p>${esc(comboText)}</p>
            </section>

            <section class="r-section">
              <h2>${esc(t("startTitle"))}</h2>
              <ol class="steps">${steps}</ol>
              ${techStep ? `<p class="step-extra"><strong>${esc(t("withTech", short(r.techniques[0])))}</strong> ${esc(techStep[1])}</p>` : ""}
            </section>

            <section class="r-section">
              <h2>${esc(t("warnTitle"))}</h2>
              <ul class="warnings">${warnings}</ul>
            </section>
          </article>

          <aside class="also" aria-labelledby="also-name">
            <p class="also-label">${esc(t("alsoConsider"))}</p>
            <div class="also-head">
              <h2 class="also-name" id="also-name">${esc(alt.name)}</h2>${chipHTML(r.frameworkAlt)}
            </div>
            <p class="also-if">“${esc(alt.alsoIf || alt.tagline)}”</p>
            ${altWhy ? `<p class="also-why">${esc(t("altWhy", altWhy.charAt(0).toLowerCase() + altWhy.slice(1)))}</p>` : ""}
            ${r.approach.close ? `<p class="also-why">${esc(t("closeCall", r.approach.delta >= 0 ? t("morePredictive") : t("moreAdaptive")))}</p>` : ""}
            ${toggleBtn("learn-alt", t("learnAbout", short(r.frameworkAlt)), "learn-toggle")}
            ${learnHTML(r.frameworkAlt, "learn-alt")}
          </aside>

          <div class="others">
            ${toggleBtn("others-body", t("whyNotOne"), "learn-toggle")}
            <div class="others-body" id="others-body" hidden>
              <p>${esc(t("whyNotBody1"))}</p>
              <p>${esc(t("whyNotBody2"))}</p>
            </div>
          </div>

          <section class="lesson">
            <p class="big">${esc(t("lessonBig"))}</p>
            <p>${esc(t("lessonMid"))}</p>
            <p class="small">${esc(t("lessonSmall"))}</p>
          </section>

          <div class="actions">
            <button type="button" class="btn btn-primary" data-action="copy">${esc(t("copy"))}</button>
            <button type="button" class="btn btn-outline" data-action="restart">${esc(t("retake"))}</button>
            <button type="button" class="btn btn-ghost" data-action="edit">${esc(t("edit"))}</button>
            <span class="copy-status" role="status" aria-live="polite"></span>
            <div class="copy-fallback" hidden></div>
          </div>

          <p class="source">${esc(t("sourceText"))} <a href="${esc(SOURCE.url)}" target="_blank" rel="noopener noreferrer">${esc(t("sourceLink"))}</a>. ${esc(t("sourceNote"))}</p>
        </div>
      </section>`;

    window.scrollTo({ top: 0 });
    const h = document.getElementById("result-name");
    if (h) h.focus({ preventScroll: true });
    announce(t("announceProfile", approach.name, mT(r.framework).name));
  }

  /* ---------- copy ---------- */
  function showCopied(ok) {
    const status = app.querySelector(".copy-status");
    const btn = app.querySelector('[data-action="copy"]');
    if (ok) {
      if (status) status.textContent = t("copiedStatus");
      if (btn) btn.textContent = t("copied");
      window.setTimeout(() => {
        if (btn && btn.isConnected) btn.textContent = t("copy");
        if (status && status.isConnected) status.textContent = "";
      }, 2400);
    } else {
      const box = app.querySelector(".copy-fallback");
      if (!box) return;
      box.hidden = false;
      box.innerHTML = `<label class="sr-only" for="share-text">${esc(t("copyLabel"))}</label><textarea id="share-text" readonly>${esc(lastShareText)}</textarea>`;
      const ta = box.querySelector("textarea");
      ta.focus();
      ta.select();
      if (status) status.textContent = t("copyManual");
    }
  }

  function legacyCopy(text) {
    try {
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.setAttribute("readonly", "");
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      const ok = document.execCommand && document.execCommand("copy");
      document.body.removeChild(ta);
      return !!ok;
    } catch (e) {
      return false;
    }
  }

  function copyResult() {
    const text = lastShareText;
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(() => showCopied(true), () => showCopied(legacyCopy(text)));
    } else {
      showCopied(legacyCopy(text));
    }
  }

  /* ---------- events ---------- */
  app.addEventListener("click", e => {
    const wordBtn = e.target.closest(".word");
    if (wordBtn) { selectWord(wordBtn.dataset.word); return; }

    const optBtn = e.target.closest(".opt");
    if (optBtn) { selectOption(optBtn.dataset.opt, false); return; }

    const toggle = e.target.closest("[data-toggle]");
    if (toggle) {
      const panel = document.getElementById(toggle.dataset.toggle);
      if (!panel) return;
      const open = toggle.getAttribute("aria-expanded") === "true";
      toggle.setAttribute("aria-expanded", open ? "false" : "true");
      panel.hidden = open;
      return;
    }

    const actionBtn = e.target.closest("[data-action]");
    if (!actionBtn || actionBtn.disabled) return;
    switch (actionBtn.dataset.action) {
      case "start":
        state.screen = "quiz"; state.index = 0; state.dir = 1; state.word = null;
        renderQuestion(true);
        break;
      case "next": goNext(); break;
      case "back": goBack(); break;
      case "restart":
        state.answers = {}; state.index = 0; state.dir = 1; state.screen = "quiz"; state.word = null;
        renderQuestion(true);
        break;
      case "edit":
        state.screen = "quiz"; state.index = TOTAL - 1; state.dir = -1;
        renderQuestion(true);
        break;
      case "copy": copyResult(); break;
      case "close-word": {
        const active = app.querySelector(".word.is-active");
        selectWord(state.word);
        if (active) active.focus();
        break;
      }
    }
  });

  app.addEventListener("keydown", e => {
    if (state.screen !== "quiz") return;
    const optBtn = e.target.closest && e.target.closest(".opt");
    if (!optBtn) return;
    const all = Array.from(app.querySelectorAll(".opt"));
    const i = all.indexOf(optBtn);
    let target = null;
    switch (e.key) {
      case "ArrowDown": case "ArrowRight": target = all[(i + 1) % all.length]; break;
      case "ArrowUp": case "ArrowLeft": target = all[(i - 1 + all.length) % all.length]; break;
      case "Home": target = all[0]; break;
      case "End": target = all[all.length - 1]; break;
      case "Enter":
        e.preventDefault();
        selectOption(optBtn.dataset.opt, true);
        goNext();
        return;
      default: return;
    }
    e.preventDefault();
    selectOption(target.dataset.opt, true);
  });

  document.addEventListener("keydown", e => {
    if (state.screen !== "quiz" || e.altKey || e.ctrlKey || e.metaKey) return;
    const tag = (e.target.tagName || "").toLowerCase();
    if (tag === "input" || tag === "textarea" || tag === "select") return;
    const inOptions = e.target.closest && e.target.closest(".opt");
    const onButton = tag === "button";

    if (/^[0-9]$/.test(e.key)) {
      const q = currentQ();
      const idx = e.key === "0" ? 9 : Number(e.key) - 1;
      if (q.options[idx]) { e.preventDefault(); selectOption(q.options[idx].id, true); }
      return;
    }
    if (inOptions) return; // handled above
    if ((e.key === "ArrowDown" || e.key === "ArrowUp") && !onButton) {
      const target = app.querySelector('.opt[aria-checked="true"]') || app.querySelector(".opt");
      if (target) { e.preventDefault(); target.focus(); }
      return;
    }
    if (e.key === "Enter" && !onButton) {
      e.preventDefault();
      goNext();
    }
  });

  /* ---------- language ---------- */
  function renderCurrent() {
    if (state.screen === "result") renderResult();
    else if (state.screen === "quiz") renderQuestion(false);
    else renderIntro();
  }

  function setLang(lang) {
    if (lang === LANG) return;
    LANG = lang;
    document.documentElement.lang = lang;
    document.title = t("htmlTitle");
    const sw = document.getElementById("langswitch");
    if (sw) {
      sw.querySelectorAll(".lang-btn").forEach(b => {
        const on = b.dataset.lang === lang;
        b.classList.toggle("is-on", on);
        b.setAttribute("aria-pressed", on ? "true" : "false");
      });
    }
    state.word = null;
    renderCurrent();
  }

  const langSwitch = document.getElementById("langswitch");
  if (langSwitch) {
    langSwitch.addEventListener("click", e => {
      const btn = e.target.closest(".lang-btn");
      if (btn) setLang(btn.dataset.lang);
    });
  }

  renderIntro();
})();

</script>
</body>
</html>
